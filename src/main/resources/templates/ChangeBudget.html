<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('Annual allowances', 'Admin', 'entitlement', ~{::#content})}">
<body><section id="content" class="cats-stack">
<div class="cats-page-header"><div><a class="cats-back" th:href="@{/admin/entitlements(year=${year})}">Annual allowances</a><h1>Edit annual allowance</h1><p class="cats-sub" th:text="${staff.name + ' · ' + staff.staffId + ' · ' + year}"></p></div></div>
<form method="post" th:action="@{/admin/entitlements/save}" class="cats-card cats-stack">
<input type="hidden" name="staffId" th:value="${staff.userId}"><input type="hidden" name="year" th:value="${year}">
<div><label for="dayLimit" class="form-label">Training days limit</label><input class="form-control" type="number" name="dayLimit" id="dayLimit" min="0" max="366" step="0.5" th:value="${summary.dayLimit}" required></div>
<div><label for="budget" class="form-label">Training budget (SGD)</label><input class="form-control" type="number" name="budget" id="budget" min="0" step="0.01" th:value="${summary.budget}" required></div>
<p class="cats-sub" th:text="${'Already reserved: ' + summary.usedDays + ' days and SGD ' + summary.usedBudget}"></p>
<div><button class="btn btn-primary">Save allowance</button></div></form>
</section></body></html>
