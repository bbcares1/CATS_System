<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout('Calculate a schedule', 'Admin', 'schedule', ~{::#content})}"
>
  <body>
    <section id="content" class="cats-stack">
      <div class="cats-page-header">
        <div>
          <h1>Calculate a course schedule</h1>
          <p class="cats-sub">
            Preview working dates. Nothing is saved until you create a course
            schedule.
          </p>
        </div>
        <a th:href="@{/admin/batches}" class="btn btn-outline-secondary"
          >Course schedules</a
        >
      </div>
      <div class="card card-body">
        <form
          method="post"
          th:action="@{/admin/schedule}"
          th:object="${form}"
          class="cats-stack"
          novalidate
        >
          <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
            <ul>
              <li th:each="e : ${#fields.allErrors()}" th:text="${e}"></li>
            </ul>
          </div>
          <div class="cats-grid cats-grid-2">
            <div>
              <label class="form-label" for="category">Category</label
              ><select class="form-select" th:field="*{category}">
                <option value="">Choose one</option>
                <option
                  th:each="item : ${categories}"
                  th:value="${item}"
                  th:text="${item.displayName}"
                ></option>
              </select>
              <div class="text-danger" th:errors="*{category}"></div>
            </div>
            <div>
              <label class="form-label" for="startDate"
                >Requested start date</label
              ><input
                class="form-control"
                type="date"
                th:field="*{startDate}"
                required
              />
              <div class="text-danger" th:errors="*{startDate}"></div>
            </div>
            <div>
              <label class="form-label" for="days">Training days</label
              ><input
                class="form-control"
                type="number"
                th:field="*{days}"
                min="0.5"
                max="260"
                step="0.5"
                required
              />
              <div class="text-danger" th:errors="*{days}"></div>
            </div>
            <div>
              <label class="form-label" for="halfDayPeriod">Session</label
              ><select class="form-select" th:field="*{halfDayPeriod}">
                <option value="">Full day</option>
                <option value="AM">AM</option>
                <option value="PM">PM</option></select
              ><small class="text-muted"
                >AM/PM is only for one day of Internal Training.</small
              >
            </div>
          </div>
          <div><button class="btn btn-primary">Preview dates</button></div>
        </form>
      </div>
      <div th:if="${schedule != null}" class="card card-body">
        <h2>Suggested dates</h2>
        <p>
          <b th:text="${schedule.start}"></b> to
          <b th:text="${schedule.end}"></b> ·
          <span th:text="${schedule.days}"></span> training days
        </p>
        <p class="text-muted">Weekends and public holidays are excluded.</p>
        <ul>
          <li th:each="day : ${schedule.dates}" th:text="${day}"></li>
        </ul>
        <a th:href="@{/admin/batches/new}">Create a course schedule</a>
      </div>
    </section>
  </body>
</html>
