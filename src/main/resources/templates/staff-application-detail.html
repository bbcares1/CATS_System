<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('Application details', 'Staff', 'history', ~{::#content})}">
<body><section id="content" class="cats-stack">


            <div class="cats-page-header"><div><h1 th:text="${course.courseTitle}"></h1></div></div>


            <!-- Application details: Show the course information and decision. -->
            <dl class="cats-dl card card-body">
                <dt>Application ID</dt>
                <dd th:text="${course.courseId}"></dd>
                <dt>Status</dt>
                <dd><span th:replace="~{fragments/ui :: status(${course.status})}"></span></dd>
                <dt>Category</dt>
                <dd th:text="${course.courseCategory.displayName}"></dd>
                <dt>Training provider</dt>
                <dd th:text="${course.trainingProvider}"></dd>
                <dt>Course period</dt>
                <dd>
                    <span th:text="${course.courseStartDate}"></span> to <span th:text="${course.courseEndDate}"></span></dd>
                <dt>Session</dt>
                <dd th:text="${#strings.isEmpty(course.halfDayPeriod) ? 'Full days' : course.halfDayPeriod}"></dd>
                <dt>Training days</dt>
                <dd th:text="${course.trainingDays}"></dd>
                <dt>Course fee ($)</dt>
                <dd th:text="${course.courseFee}"></dd>
                <dt>Justification</dt>
                <dd th:text="${course.justification}"></dd>
                <dt>Work dissemination</dt>
                <dd th:text="${course.workDissemination}"></dd>
                <dt>Manager decision / reason</dt>
                <dd th:text="${course.decisionReason ?: 'No decision recorded'}"></dd>
                <dt>Reviewed at</dt>
                <dd th:text="${course.reviewedAt}"></dd>
                <dt>Experience comments</dt>
                <dd th:text="${course.experienceComments}"></dd>
            </dl>
            <!-- Pending application: Show the edit and delete options. -->
            <div class="cats-page-actions" th:if="${course.status.name() == 'APPLIED' or course.status.name() == 'UPDATED'}">
                <a class="btn btn-outline-secondary" th:href="@{/staff/applications/{id}/edit(id=${course.courseId})}">Edit</a>
                <form th:action="@{/staff/applications/{id}/delete(id=${course.courseId})}" method="post" data-confirm-title="Confirm application change" data-confirm-message="This updates your saved application and its annual reservation.">
                    <button class="btn btn-outline-danger" type="submit">Delete</button>
                </form>
            </div>
            <section th:if="${course.status.name() == 'APPROVED'}">
                <!-- Cancel application: Submit a cancellation for the approved course. -->
                <form th:action="@{/staff/applications/{id}/cancel(id=${course.courseId})}" method="post" data-confirm-title="Confirm application change" data-confirm-message="This updates your saved application and its annual reservation.">
                    <button class="btn btn-outline-danger" type="submit">Cancel Application</button>
                </form>
                <!-- Complete course: Enter experience comments after the course ends. -->
                <form th:if="${course.courseEndDate.isBefore(today)}" th:action="@{/staff/applications/{id}/complete(id=${course.courseId})}" method="post" data-confirm-title="Confirm application change" data-confirm-message="This updates your saved application and its annual reservation.">
                    <div class="cats-field">
                        <label class="form-label" for="experienceComments">Experience comments *</label>
                        <textarea class="form-control" id="experienceComments" name="experienceComments" rows="4" maxlength="2000" required></textarea>
                    </div>
                    <button class="btn btn-primary" type="submit">Mark Completed</button>
                </form>
                <p th:unless="${course.courseEndDate.isBefore(today)}">You can mark this course completed after its end date.</p>
            </section>
            <p>
                <a th:href="@{/staff/personal}">Back to History</a></p>

</section></body></html>
