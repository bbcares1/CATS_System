<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="login(title, action)">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${title} + ' - CATS'"></title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" th:href="@{/css/cats.css}"></head>
<body class="cats-login"><main class="cats-login-panel"><a class="cats-back" th:href="@{/login}">Back to login portal</a><h1 th:text="${title}"></h1><p class="cats-sub">Sign in to your workspace.</p><div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>
<!-- Login roles come from the saved account; passwords are never echoed into the form. -->
<form method="post" th:action="@{${action}}" class="cats-stack"><div><label class="form-label" for="userName">Username</label><input id="userName" name="userName" class="form-control" autocomplete="username" maxlength="255" required></div><div><label class="form-label" for="password">Password</label><input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required></div><button class="btn btn-primary">Sign in</button></form></main></body></html>
