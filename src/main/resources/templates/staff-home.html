<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('Dashboard', 'Staff', 'dashboard', ~{::#content})}">
<body><section id="content" class="cats-stack">
<div class="cats-page-header"><div><h1 th:text="'Welcome back, ' + ${currentUser.name}"></h1><p class="cats-sub" th:text="${currentUser.staffId + ' · ' + (currentUser.designation ?: 'Employee')}"></p></div><a class="btn btn-primary" th:href="@{/staff/apply}">Apply for a course</a></div>
<!-- Personal reservations include pending and completed courses, just like the Manager review. -->
<div class="cats-grid cats-grid-2">
<div class="card card-body"><h2 class="cats-card-title">Training days remaining</h2><strong class="cats-metric-value" th:text="${summary.remainingDays}"></strong><p class="cats-sub" th:text="${summary.usedDays + ' reserved / ' + summary.dayLimit + ' allocated this year'}"></p></div>
<div class="card card-body"><h2 class="cats-card-title">Training budget remaining</h2><strong class="cats-metric-value" th:text="'SGD ' + ${summary.remainingBudget}"></strong><p class="cats-sub" th:text="${'SGD ' + summary.usedBudget + ' reserved / ' + summary.budget + ' allocated'}"></p></div>
</div>
<div class="card card-body"><h2 class="cats-card-title">Your training</h2><p>Pending, approved and completed courses count towards the annual allowance.</p><p>Reporting manager: <strong th:text="${currentUser.manager?.name ?: 'Not assigned'}"></strong></p><div class="cats-page-actions"><a class="btn btn-outline-secondary" th:href="@{/staff/personal}">Course history</a><a class="btn btn-outline-secondary" th:href="@{/staff/fee}">Fee claims</a><a class="btn btn-outline-secondary" th:href="@{/training/calendar}">Training calendar</a></div></div>
</section></body></html>
