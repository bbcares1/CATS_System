<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('Claim approvals', 'Manager', 'claims', ~{::#content})}">
  <body>
    <section id="content" class="cats-stack">
      <div class="cats-page-header">
        <div>
          <h1>
            Claim approvals
          </h1>
        </div>
      </div>
      <!-- The queue contains this manager's assigned claims only. -->
      <div class="card">
        <div class="cats-table-wrap">
          <table class="table cats-table">
            <thead>
              <tr>
                <th>
                  Employee
                </th>
                <th>
                  Course
                </th>
                <th>
                  Amount
                </th>
                <th>
                  Submitted
                </th>
                <th>
                  Actions
                </th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="c : ${claims}">
                <td>
                  <strong th:text="${c.applicantName}">
                  </strong>
                  <div class="cats-cell-sub" th:text="${c.staffId}">
                  </div>
                </td>
                <td th:text="${c.courseTitle}">
                </td>
                <td th:text="'$' + ${c.amount}">
                </td>
                <td th:text="${#temporals.format(c.submittedAt,'d MMM yyyy')}">
                </td>
                <td>
                  <a th:href="@{/manager/claims/{id}(id=${c.applicationId})}">
                    Review claim
                  </a>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(claims)}">
                <td colspan="5" class="cats-empty">
                  No claims waiting for review.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div th:replace="~{fragments/claim-pagination :: pager(${claimPage}, ${claimRoute}, 'page')}"></div>
    </section>
  </body>
</html>
