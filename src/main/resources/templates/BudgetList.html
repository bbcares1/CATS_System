<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Training entitlement', 'Admin', 'entitlement', ~{::#content})}">
<body>
<section id="content">
  <div class="cats-page-header">
    <div>
      <h1>Training entitlement</h1>
      <p class="cats-sub">Review and update each staff member’s annual budget and training days.</p>
    </div>
    <a class="btn btn-outline-secondary" th:href="@{/admin/staffs}">Back to staff</a>
  </div>

  <section class="card" aria-labelledby="entitlement-table-title">
    <div class="card-header">
      <h2 id="entitlement-table-title" class="cats-card-title">Staff entitlement</h2>
    </div>
    <div class="table-responsive">
      <table class="table align-middle mb-0">
        <thead>
          <tr>
            <th scope="col">Staff member</th>
            <th scope="col">Staff ID</th>
            <th scope="col" class="cats-num">Annual budget</th>
            <th scope="col" class="cats-num">Training days</th>
            <th scope="col" class="cats-row-actions">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="s : ${staffs}">
            <td>
              <span class="fw-semibold" th:text="${s.name}">Name</span>
              <div class="cats-cell-sub" th:text="${s.role}">STAFF</div>
            </td>
            <td th:text="${s.staffId}">S001</td>
            <td class="cats-num" th:text="${s.trainingBudget != null ? '$' + #numbers.formatDecimal(s.trainingBudget, 1, 'COMMA', 2, 'POINT') : '—'}">$2,000.00</td>
            <td class="cats-num" th:text="${s.trainingDays != null ? s.trainingDays : '—'}">10</td>
            <td class="cats-row-actions">
              <a class="btn btn-sm btn-outline-secondary"
                 th:href="@{/admin/budgets/edit/{id}(id=${s.userId})}">Edit entitlement</a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(staffs)}">
            <td colspan="5">
              <div th:replace="~{fragments/ui :: empty('users', 'No staff entitlements', 'Create staff accounts to assign training entitlements.', ~{})}"></div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</section>
</body>
</html>
