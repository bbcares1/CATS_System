<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout('Schedule details', 'Admin', 'batches', ~{::#content})}"
>
  <body>
    <section id="content" class="cats-stack">
      <div class="cats-page-header">
        <div>
          <a class="cats-back" th:href="@{/admin/batches}">Back to list</a>
          <h1 th:text="${editId == null} ? 'Add schedule' : 'Edit schedule'">
            Schedule
          </h1>
          <p class="cats-sub">
            Use working days within one year. Training days are calculated
            automatically. Used schedules keep their original dates.
          </p>
        </div>
      </div>
      <div class="card card-body">
        <form
          method="post"
          th:action="@{${formAction}}"
          th:object="${form}"
          class="cats-stack"
          novalidate
        >
          <input th:replace="~{fragments/csrf :: token}" />
          <input type="hidden" th:field="*{version}" />
          <div
            th:if="${#fields.hasErrors('*')}"
            class="alert alert-danger"
            role="alert"
          >
            <ul class="mb-0">
              <li
                th:each="error : ${#fields.allErrors()}"
                th:text="${error}"
              ></li>
            </ul>
          </div>
          <div class="cats-grid cats-grid-2">
            <div>
              <label class="form-label" for="courseId">Course</label
              ><select class="form-select" th:field="*{courseId}">
                <option value="">Choose one</option>
                <option
                  th:each="item : ${courses}"
                  th:value="${item.courseId}"
                  th:text="${item.title}"
                ></option>
              </select>
              <div class="text-danger" th:errors="*{courseId}"></div>
            </div>
            <div>
              <label class="form-label" for="startDate">Start date</label
              ><input
                class="form-control"
                type="date"
                th:field="*{startDate}"
                required
              />
              <div class="text-danger" th:errors="*{startDate}"></div>
            </div>
            <div>
              <label class="form-label" for="endDate">End date</label
              ><input
                class="form-control"
                type="date"
                th:field="*{endDate}"
                required
              />
              <div class="text-danger" th:errors="*{endDate}"></div>
            </div>
            <div>
              <label class="form-label" for="halfDayPeriod">Session</label
              ><select class="form-select" th:field="*{halfDayPeriod}">
                <option value="">Full day</option>
                <option value="AM">AM</option>
                <option value="PM">PM</option></select
              ><small class="text-muted"
                >AM/PM is only for one day of Internal Training.</small
              >
            </div>
            <div>
              <label class="form-label" for="capacity">Places</label
              ><input
                class="form-control"
                type="number"
                th:field="*{capacity}"
                min="1"
                max="10000"
                required
              />
              <div class="text-danger" th:errors="*{capacity}"></div>
            </div>
            <label class="form-check"
              ><input
                class="form-check-input"
                type="checkbox"
                th:field="*{active}"
              /><span class="form-check-label"
                >Available for new applications</span
              ></label
            >
          </div>
          <div class="cats-page-actions">
            <button class="btn btn-primary">Save</button
            ><a class="btn btn-outline-secondary" th:href="@{/admin/batches}"
              >Cancel</a
            >
          </div>
        </form>
      </div>
    </section>
  </body>
</html>
