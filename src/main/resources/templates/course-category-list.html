<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('Course categories', 'Admin', 'categories', ~{::#content})}">
  <body>
    <section id="content" class="cats-stack">
      <div class="cats-page-header">
        <div>
          <h1>
            Course categories
          </h1>
          <p class="cats-sub">
            Maintain the display names. The three assignment types keep their date and fee rules.
          </p>
        </div>
      </div>
      <div class="card">
        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th>
                  Business type
                </th>
                <th>
                  Display name
                </th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="c : ${categories}">
                <td th:text="${c.kind?.displayName ?: 'Legacy category (not available for new offers)'}">
                </td>
                <td>
                  <form class="d-flex gap-2" method="post" th:action="@{/admin/categories/{id}/rename(id=${c.categoryId})}">
                    <label class="visually-hidden" th:for="'label-' + ${c.categoryId}">
                      Display name
                    </label>
                    <input class="form-control" name="label" th:id="'label-' + ${c.categoryId}" th:value="${c.categoryName}" maxlength="255" required>
                    <button class="btn btn-outline-secondary">
                      Save
                    </button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </body>
</html>
