<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Employee Login - CATS</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
  </head>
  <body class="bg-light">
    <div
      class="container d-flex justify-content-center align-items-center min-vh-100"
    >
      <div class="card shadow p-4" style="width: 450px">
        <div class="card-body">
          <h3 class="text-center text-primary mb-2">Employee Login</h3>
          <p class="text-center text-muted mb-4">Staff / Manager</p>
          <div
            th:if="${error}"
            class="alert alert-danger"
            th:text="${error}"
          ></div>

          <form th:action="@{/employee/login}" method="post">
            <div class="mb-3">
              <label class="form-label"> Designation </label>
              <select name="designation" class="form-select" required>
                <option value="" selected disabled>
                  Select Staff or Manager
                </option>
                <option value="STAFF">Staff</option>
                <option value="MANAGER">Manager</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label"> Username </label>
              <input
                type="text"
                name="userName"
                class="form-control"
                required
              />
            </div>

            <div class="mb-4">
              <label class="form-label"> Password </label>
              <input
                type="password"
                name="password"
                class="form-control"
                required
              />
            </div>

            <button type="submit" class="btn btn-primary w-100">Login</button>
          </form>

          <div class="text-center mt-3">
            <a th:href="@{/login}"> ← Return to selection page </a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
