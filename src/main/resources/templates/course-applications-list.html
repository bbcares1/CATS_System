<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Course History</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 30px;
      color: #263238
    }

    .wrap {
      max-width: 1180px;
      margin: auto
    }

    .card {
      background: #fff;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px #0001
    }

    .metrics {
      display: flex;
      gap: 14px;
      flex-wrap: wrap
    }

    .metric {
      background: #eef5ff;
      border-left: 4px solid #1976d2;
      padding: 14px;
      min-width: 150px
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    th,
    td {
      padding: 11px;
      border-bottom: 1px solid #ddd;
      text-align: left
    }

    th {
      background: #1976d2;
      color: #fff
    }

    a {
      color: #1565c0
    }

    .actions form {
      display: inline
    }

    .btn {
      border: 0;
      border-radius: 4px;
      padding: 7px 10px;
      cursor: pointer
    }

    .danger {
      color: #b71c1c
    }

    .success {
      color: #176b2c
    }

    .empty {
      text-align: center;
      padding: 28px;
      color: #68757d
    }
  </style>
</head>

<body>
  <main class="wrap">
    <div class="card">
      <h1>Personal Course History - <span th:text="${year}"></span></h1>
      <p class="success" th:if="${success}" th:text="${success}"></p>
      <div class="metrics">
        <div class="metric"><strong>Annual training allowance</strong><br><span
            th:text="${summary.remainingDays + summary.usedDays}"></span> days</div>
        <div class="metric"><strong>Used days</strong><br><span th:text="${summary.usedDays}"></span></div>
        <div class="metric"><strong>Remaining days</strong><br><span th:text="${summary.remainingDays}"></span></div>
        <div class="metric"><strong>Annual budget used</strong><br>$<span th:text="${summary.usedBudget}"></span></div>
        <div class="metric"><strong>Budget remaining</strong><br>$<span th:text="${summary.remainingBudget}"></span>
        </div>
      </div>
    </div>
    <div class="card">
      <a class="btn" th:href="@{/staff/course-applications/new}">Apply for a course</a>
      <table th:if="${not #lists.isEmpty(applications)}">
        <thead>
          <tr>
            <th>Course</th>
            <th>Category</th>
            <th>Provider</th>
            <th>Dates</th>
            <th>Days</th>
            <th>Fee</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="application : ${applications}">
            <td><a th:href="@{/staff/course-applications/{id}(id=${application.courseId})}"
                th:text="${application.courseTitle}"></a></td>
            <td th:text="${application.courseCategory}"></td>
            <td th:text="${application.trainingProvider}"></td>
            <td><span th:text="${application.courseStartDate}"></span> - <span
                th:text="${application.courseEndDate}"></span></td>
            <td th:text="${application.trainingDays}"></td>
            <td th:text="${application.courseFee}"></td>
            <td th:text="${application.status}"></td>
            <td class="actions">
              <a th:if="${application.status.name() == 'APPLIED' or application.status.name() == 'UPDATED'}"
                th:href="@{/staff/course-applications/{id}/edit(id=${application.courseId})}">Edit</a>
              <form th:if="${application.status.name() == 'APPLIED' or application.status.name() == 'UPDATED'}"
                th:action="@{/staff/course-applications/{id}/delete(id=${application.courseId})}" method="post"
                onsubmit="return confirm('Delete this application?');"><button class="btn danger">Delete</button></form>
              <form th:if="${application.status.name() == 'APPROVED'}"
                th:action="@{/staff/course-applications/{id}/cancel(id=${application.courseId})}" method="post"
                onsubmit="return confirm('Cancel this approved application?');"><button class="btn">Cancel</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
      <div class="empty" th:if="${#lists.isEmpty(applications)}">No course applications for this year yet. Start by
        submitting an application.</div>
    </div>
  </main>
</body>

</html>
