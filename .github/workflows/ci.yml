name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile
        run: ./mvnw -B -ntp -DskipTests compile

      - name: Run fast unit tests
        run: ./mvnw -B -ntp "-Dtest=*ServiceTest,*ControllerTest" test

      - name: Run all tests with H2
        run: ./mvnw -B -ntp test

      - name: Check fresh demo initialization and repeatable reset
        run: |
          bash scripts/reset-demo.sh --yes
          bash scripts/reset-demo.sh --yes

      - name: Start isolated MySQL tests database
        run: docker compose -f compose.test.yml up -d --wait

      - name: Run all tests with MySQL
        run: ./mvnw -B -ntp "-Dspring.profiles.active=mysql-test" test

      - name: Stop tests database
        if: always()
        run: docker compose -f compose.test.yml down

      - name: Stop demo database
        if: always()
        run: docker compose down
