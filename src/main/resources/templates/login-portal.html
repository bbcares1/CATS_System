<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CATS</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" th:href="@{/css/cats.css}" />
  </head>
  <body class="cats-login">
    <main class="cats-login-box">
      <div class="cats-login-brand">
        <span class="cats-brand-mark">C</span><strong>CATS</strong>
      </div>
      <section class="card">
        <div class="card-body cats-stack">
          <h1>Log in</h1>
          <a class="btn btn-primary" th:href="@{/employee/login}"
            >Employee login</a
          >
          <a class="btn btn-outline-secondary" th:href="@{/admin/login}"
            >Admin login</a
          >
        </div>
      </section>
    </main>
  </body>
</html>
