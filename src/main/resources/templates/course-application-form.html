<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Course Application</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            padding: 25px
        }

        .card {
            max-width: 760px;
            margin: auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #0001
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 14px
        }

        input,
        select,
        textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 9px;
            margin-top: 5px;
            border: 1px solid #bbb;
            border-radius: 4px
        }

        button {
            margin-top: 20px;
            background: #1976d2;
            color: white;
            border: 0;
            border-radius: 4px;
            padding: 10px 18px;
            cursor: pointer
        }

        .error {
            background: #ffebee;
            color: #b71c1c;
            padding: 10px
        }

        .hint {
            color: #5f6b72;
            font-size: .9em
        }

        .summary {
            background: #eef5ff;
            padding: 12px;
            margin-top: 15px
        }
    </style>
</head>

<body>
    <main class="card"><a th:href="@{/staff/course-applications}">← Personal Course History</a>
        <h1 th:text="${editId == null ? 'New Course Application' : 'Edit Course Application'}"></h1>
        <div class="error" th:if="${error}" th:text="${error}"></div>
        <form th:action="${formAction}" th:object="${application}" method="post"
            onsubmit="this.querySelector('button[type=submit]').disabled=true">
            <input th:if="${editId != null}" type="hidden" name="applicationId" th:value="${editId}">
            <label>Course Title *<input th:field="*{courseTitle}" required maxlength="200"></label>
            <label>Course Category *<select th:field="*{courseCategory}" id="category" required>
                    <option value="">Select a category</option>
                    <option th:each="category : ${categories}" th:value="${category}" th:text="${category.displayName}">
                    </option>
                </select></label>
            <label>Training Provider<input th:field="*{trainingProvider}" maxlength="200"></label>
            <label>Start Date *<input type="date" th:field="*{courseStartDate}" id="startDate" th:min="${today}"
                    required></label>
            <label>End Date *<input type="date" th:field="*{courseEndDate}" id="endDate" required></label>
            <label>Course Fee<input type="number" th:field="*{courseFee}" id="fee" min="0" step="0.01"></label>
            <label>Half-day session (Internal Training only)<select th:field="*{halfDayPeriod}" id="halfDay">
                    <option value="">Full day</option>
                    <option value="AM">Morning (AM)</option>
                    <option value="PM">Afternoon (PM)</option>
                </select></label>
            <label>Justification *<textarea th:field="*{justification}" required rows="4"></textarea></label>
            <label>Work Dissemination<textarea th:field="*{workDissemination}" rows="3"></textarea></label>
            <div class="summary" id="summary">Enter dates to see the estimated training days and budget check.</div>
            <button type="submit">Submit application</button>
        </form>
    </main>
    <script>
        const form = document.querySelector('form'), summary = document.getElementById('summary'), category = document.getElementById('category'), fee = document.getElementById('fee'), half = document.getElementById('halfDay');
        function refresh() { if (category.value === 'INTERNAL_TRAINING') { fee.value = '0'; fee.readOnly = true; half.disabled = false } else { fee.readOnly = false; half.value = ''; half.disabled = true } const start = document.getElementById('startDate'), end = document.getElementById('endDate'); if (!start.value || !end.value) return; const data = new FormData(form); fetch('/staff/course-applications/summary', { method: 'POST', body: data }).then(r => r.ok ? r.json() : r.text()).then(x => { if (typeof x === 'object') summary.textContent = `This application: ${x.requestedDays} day(s). Remaining after existing applications: ${Math.max(0, x.remainingDays - x.requestedDays)} day(s). Budget remaining before this application: $${x.remainingBudget}.`; }); }
        [category, fee, half, document.getElementById('startDate'), document.getElementById('endDate')].forEach(e => e.addEventListener('change', refresh)); refresh();
    </script>
</body>

</html>
