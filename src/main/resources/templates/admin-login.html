<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Login - CATS</title>
</head>
  <body>
      <header>
          <nav>
              <a th:href="@{/}">
                  &larr; Back to login portal
              </a>
          </nav>
      </header>
      <main>

          <section class="cats-header">
              <div class="cats-logo">
                  <span>CATS</span>
              </div>
              <p>Course Application Tracking System</p>
          </section>
          <section class="login-card">
              <div class="login-icon">
                  <span>🛡</span>
              </div>
              <div class="login-heading">
                  <h1>Administrator Login</h1>
                  <p>
                      Enter your account details to access your workspace.
                  </p>
              </div>
              <form th:action="@{/admin/login}" method="post">

                  <div class="form-group">
                      <label for="username">
                          Username <span>*</span>
                      </label>
                      <input
                          type="text"
                          id="username"
                          name="userName"
                          placeholder="e.g. ryan"
                          required>
                  </div>
                  <div class="form-group">
                      <label for="password">
                          Password <span>*</span>
                      </label>
                      <div class="password-field">
                          <input
                              type="password"
                              id="password"
                              name="password"
                              placeholder="Enter your password"
                              required>

                          <button type="button">
                              Show
                          </button>
                      </div>
                  </div>
                  <div
                      class="error-message"
                      th:if="${error}">
                      <p th:text="${error}">
                          Invalid username or password.
                      </p>
                  </div>
                  <div class="form-actions">
                      <button type="submit">
                          Login as Administrator
                      </button>
                  </div>
              </form>
          </section>
      </main>
  </body>
</html>
