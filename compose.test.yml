name: cats-tests
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cats_test
      MYSQL_USER: cats_test
      MYSQL_PASSWORD: cats_test_password
      MYSQL_ROOT_PASSWORD: cats_test_root_password
    ports:
      - "127.0.0.1:3308:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
