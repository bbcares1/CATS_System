<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout('Course schedules', 'Admin', 'batches', ~{::#content})}"
>
  <body>
    <section id="content" class="cats-stack">
      <div class="cats-page-header">
        <h1>Course schedules</h1>
        <div class="cats-page-actions">
          <a class="btn btn-primary" th:href="@{/admin/batches/new}"
            >Add schedule</a
          ><a class="btn btn-outline-secondary" th:href="@{/admin/schedule}"
            >Calculate dates</a
          >
        </div>
      </div>
      <div class="card card-body">
        <p th:if="${#lists.isEmpty(rows)}">
          No records yet. Add one to get started.
        </p>
        <div class="table-responsive" th:unless="${#lists.isEmpty(rows)}">
          <table class="table align-middle">
            <thead>
              <tr>
                <th scope="col">Course</th>
                <th scope="col">Dates</th>
                <th scope="col">Training days</th>
                <th scope="col">Places</th>
                <th scope="col">Status</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="row : ${rows}">
                <td><b th:text="${row.courseDetail.title}"></b></td>
                <td>
                  <span
                    th:text="${#temporals.format(row.courseStartDate,'d MMM yyyy',T(java.util.Locale).ENGLISH)} + ' to ' + ${#temporals.format(row.courseEndDate,'d MMM yyyy',T(java.util.Locale).ENGLISH)}"
                  ></span>
                  <span th:text="${row.halfDayPeriod}"></span>
                </td>
                <td><span th:text="${row.trainingDays}"></span></td>
                <td><span th:text="${row.capacity}"></span></td>
                <td>
                  <span th:text="${row.active} ? 'Active' : 'Archived'"></span>
                </td>
                <td>
                  <div class="cats-page-actions">
                    <a th:href="@{/admin/batches/{id}/edit(id=${row.batchId})}"
                      >Edit</a
                    >
                    <form
                      method="post"
                      th:action="@{/admin/batches/{id}/delete(id=${row.batchId})}"
                      data-confirm-title="Remove this record?"
                      data-confirm-message="Remove this record from active use? Referenced records may be archived or kept."
                    >
                      <input th:replace="~{fragments/csrf :: token}" />
                      <input
                        type="hidden"
                        name="version"
                        th:value="${row.version}"
                      /><button class="btn btn-link text-danger p-0">
                        Remove
                      </button>
                    </form>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div
        th:replace="~{fragments/list-pagination :: pager(${pageData},'/admin/batches',null,null)}"
      ></div>
    </section>
  </body>
</html>
