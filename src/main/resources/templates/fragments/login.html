<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:fragment="login(title, action)"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${title} + ' - CATS'">CATS</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" th:href="@{/css/cats.css}" />
  </head>
  <body class="cats-login">
    <main class="cats-login-box">
      <div class="cats-login-brand">
        <span class="cats-brand-mark">C</span><strong>CATS</strong>
      </div>
      <section class="card">
        <div class="card-body">
          <h1 th:text="${title}">Employee login</h1>
          <div
            class="alert alert-danger"
            role="alert"
            th:if="${error}"
            th:text="${error}"
          ></div>
          <form
            class="cats-stack"
            th:action="@{${action}}"
            method="post"
            novalidate
          >
            <input th:replace="~{fragments/csrf :: token}" />
            <div class="cats-field">
              <label class="form-label" for="userName">Username</label>
              <input
                class="form-control"
                id="userName"
                name="userName"
                th:value="${userName}"
                autocomplete="username"
                required
              />
            </div>
            <div class="cats-field">
              <label class="form-label" for="password">Password</label>
              <div class="input-group">
                <input
                  class="form-control"
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  required
                />
                <button
                  class="btn btn-outline-secondary"
                  type="button"
                  data-password-toggle="password"
                  aria-label="Show password"
                  aria-pressed="false"
                >
                  Show
                </button>
              </div>
            </div>
            <button class="btn btn-primary" type="submit">Log in</button>
          </form>
        </div>
      </section>
      <a class="cats-login-foot" th:href="@{/login}">Back to login options</a>
    </main>
    <script th:src="@{/js/login.js}"></script>
  </body>
</html>
