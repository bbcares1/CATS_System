spring.application.name=project




# I am doing some monkey business
#This code is not checked in
# Connection to MySQL DB

#create a schema in mySQL called group6
spring.datasource.url=jdbc:mysql://localhost:3306/group6
spring.datasource.username=root

#enter your own password
spring.datasource.password=

#Connection to H2/MSSQL Server
#spring.datasource.url=

#spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Session is connecting the java program to db
# false connection to the DB pool conserved
spring.jpa.open-in-view=false

# Force Spring Boot to run initialization scripts for external databases like MySQL
spring.sql.init.mode=always
# Defer data.sql execution until AFTER Hibernate creates the tables
spring.jpa.defer-datasource-initialization=true

# H2 in‑memory database
spring.datasource.url=jdbc:h2:mem:catsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# enable h2 console web page
spring.h2.console.enabled=true
spring.h2.console.path=/h2‑console

# auto create‑drop table
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

