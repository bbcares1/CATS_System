<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout('Admin dashboard', 'Admin', 'dashboard', ~{::#content})}"
>
  <body>
    <section id="content" class="cats-stack">
      <div class="cats-page-header"><h1>Admin dashboard</h1></div>
      <div class="cats-grid cats-grid-2">
        <section class="card card-body">
          <h2 class="cats-card-title">Accounts and reporting managers</h2>
          <div class="cats-page-actions">
            <a class="btn btn-outline-secondary" th:href="@{/admin/accounts}"
              >Manage accounts</a
            >
            <a class="btn btn-quiet" th:href="@{/admin/entitlements}"
              >Annual allowances</a
            >
          </div>
        </section>
        <section class="card card-body">
          <h2 class="cats-card-title">Courses</h2>
          <div class="cats-page-actions">
            <a class="btn btn-primary" th:href="@{/admin/courses/new}"
              >Add course</a
            >
            <a class="btn btn-quiet" th:href="@{/admin/courses}"
              >View courses</a
            >
          </div>
        </section>
        <section class="card card-body">
          <h2 class="cats-card-title">Reimbursements</h2>
          <a class="btn btn-outline-secondary" th:href="@{/admin/payments}"
            >View approved claims</a
          >
        </section>
        <section class="card card-body">
          <h2 class="cats-card-title">Training</h2>
          <div class="cats-page-actions">
            <a class="btn btn-outline-secondary" th:href="@{/training/calendar}"
              >Training calendar</a
            >
            <a class="btn btn-quiet" th:href="@{/admin/reports}">Reports</a>
          </div>
        </section>
      </div>
    </section>
  </body>
</html>
