<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Course Application</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            padding: 30px
        }

        .card {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #0001
        }

        dt {
            font-weight: bold;
            margin-top: 12px
        }

        dd {
            margin: 3px 0
        }

        button {
            padding: 9px 13px;
            margin: 5px 3px;
            border: 0;
            border-radius: 4px;
            cursor: pointer
        }

        .error {
            color: #b71c1c
        }

        .success {
            color: #176b2c
        }
    </style>
</head>

<body>
    <main class="card"><a th:href="@{/staff/course-applications}">← Personal Course History</a>
        <h1 th:text="${application.courseTitle}"></h1>
        <p class="success" th:if="${success}" th:text="${success}"></p>
        <dl>
            <dt>Category</dt>
            <dd th:text="${application.courseCategory}"></dd>
            <dt>Training provider</dt>
            <dd th:text="${application.trainingProvider ?: '—'}"></dd>
            <dt>Dates</dt>
            <dd><span th:text="${application.courseStartDate}"></span> - <span
                    th:text="${application.courseEndDate}"></span></dd>
            <dt>Training days</dt>
            <dd th:text="${application.trainingDays}"></dd>
            <dt>Course fee</dt>
            <dd th:text="${application.courseFee}"></dd>
            <dt>Justification</dt>
            <dd th:text="${application.justification}"></dd>
            <dt>Work dissemination</dt>
            <dd th:text="${application.workDissemination ?: '—'}"></dd>
            <dt>Status</dt>
            <dd th:text="${application.status}"></dd>
            <dt>Manager decision / reason</dt>
            <dd th:text="${application.decisionReason ?: 'Pending review'}"></dd>
            <dt>Experience comments</dt>
            <dd th:text="${application.experienceComments ?: '—'}"></dd>
        </dl>
        <p><a th:if="${application.status.name() == 'APPLIED' or application.status.name() == 'UPDATED'}"
                th:href="@{/staff/course-applications/{id}/edit(id=${application.courseId})}">Edit application</a></p>
        <form th:if="${application.status.name() == 'APPLIED' or application.status.name() == 'UPDATED'}"
            th:action="@{/staff/course-applications/{id}/delete(id=${application.courseId})}" method="post"
            onsubmit="return confirm('Delete this application?');"><button>Delete</button></form>
        <form th:if="${application.status.name() == 'APPROVED'}"
            th:action="@{/staff/course-applications/{id}/cancel(id=${application.courseId})}" method="post"
            onsubmit="return confirm('Cancel this approved application?');"><button>Cancel</button></form>
        <form th:if="${application.status.name() == 'APPROVED'}"
            th:action="@{/staff/course-applications/{id}/complete(id=${application.courseId})}" method="post">
            <label>Learning experience comments<br><textarea name="experienceComments" required rows="4"
                    cols="60"></textarea></label><br><button>Mark as completed</button></form>
    </main>
</body>

</html>
