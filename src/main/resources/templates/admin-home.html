<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - CATS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
    <a class="navbar-brand text-danger" th:href="@{/admin}">CATS Administrator</a>
    <div class="ms-auto d-flex align-items-center text-white">
        <span class="me-3">Admin: <strong th:text="${currentUser.name}">Admin</strong></span>
        <a th:href="@{/logout}" class="btn btn-sm btn-outline-danger">Log Out</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="card shadow-sm p-4">
        <h4 class="text-danger">CATS System Administration</h4>
        <hr/>
        <p>Admin ID <strong th:text="${currentUser.userName}"></strong> successfully logged in to the admin dashboard.</p>
    </div>
</div>
</body>
</html>
