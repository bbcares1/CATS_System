<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Edit training entitlement', 'Admin', 'entitlement', ~{::#content})}">
<body>
<section id="content">
  <div class="cats-page-header">
    <div>
      <h1>Edit training entitlement</h1>
      <p class="cats-sub">Update the annual allowance for this staff member.</p>
    </div>
  </div>

  <section class="card">
    <div class="card-body">
      <form th:action="@{/admin/budgets/save}" th:object="${staff}" method="post" class="cats-form" novalidate>
        <input type="hidden" th:field="*{userId}">
        <div th:if="${#fields.hasAnyErrors()}" class="cats-error-summary" role="alert">
          <div><h2>Check the entitlement values</h2>
            <ul><li th:each="error : ${#fields.allErrors()}" th:text="${error}">Please correct this field.</li></ul>
          </div>
        </div>
        <div class="cats-summary">
          <div><span>Staff member</span><b th:text="${staff.name}">Name</b></div>
          <div><span>Staff ID</span><b th:text="${staff.staffId}">S001</b></div>
          <div><span>Role</span><b th:text="${staff.role}">STAFF</b></div>
        </div>
        <div>
          <label class="form-label" for="trainingBudget">Annual training budget</label>
          <div class="input-group">
            <span class="input-group-text">$</span>
            <input type="number" id="trainingBudget" th:field="*{trainingBudget}"
                   class="form-control" min="0" step="0.01" required>
          </div>
          <div class="cats-field-msg" th:if="${#fields.hasErrors('trainingBudget')}" th:errors="*{trainingBudget}"></div>
        </div>
        <div>
          <label class="form-label" for="trainingDays">Annual training days</label>
          <input type="number" id="trainingDays" th:field="*{trainingDays}"
                 class="form-control" min="0" step="1" required>
          <div class="cats-field-msg" th:if="${#fields.hasErrors('trainingDays')}" th:errors="*{trainingDays}"></div>
        </div>
        <div class="cats-form-footer">
          <a class="btn btn-outline-secondary" th:href="@{/admin/budgets}">Cancel</a>
          <button type="submit" class="btn btn-primary">Save entitlement</button>
        </div>
      </form>
    </div>
  </section>
</section>
</body>
</html>
