# Test database: Use a separate database from the running application.
spring.config.import=optional:file:./.local-staff-test.properties
spring.datasource.url=jdbc:mysql://localhost:3306/cats_ryan_staff_test
spring.datasource.username=${CATS_TEST_DB_USER:cats_ryan_test}
spring.datasource.password=${CATS_TEST_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
