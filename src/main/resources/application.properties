spring.application.name=cats
spring.profiles.default=dev

# MySQL initializes an empty volume. Application startup only validates its schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=11MB

# Empty SMTP settings allow local development without a mail account.
cats.mail.from=${CATS_MAIL_FROM:}
cats.public-url=${CATS_PUBLIC_URL:http://localhost:8081}
server.port=${CATS_HTTP_PORT:8081}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never

# Keep session identifiers in cookies, not in shared page links.
server.servlet.session.tracking-modes=cookie
