<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Staff Dashboard - CATS</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary px-4">
      <a class="navbar-brand fw-bold" th:href="@{/staff}"
        >CATS Employee Portal</a
      >
      <div class="ms-auto d-flex align-items-center text-white">
        <span class="me-3"
          >Hello, <strong th:text="${currentUser.name}">Employee</strong>
          <span
            class="badge bg-light text-primary ms-1"
            th:text="${currentUser.role}"
            >ROLE</span
          >
        </span>
        <a
          th:if="${currentUser.role.name() == 'MANAGER'}"
          th:href="@{/manager}"
          class="btn btn-sm btn-warning me-2"
          >Manager Workspace</a
        >
        <a th:href="@{/logout}" class="btn btn-sm btn-outline-light">Log Out</a>
      </div>
    </nav>

    <div class="container mt-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="text-primary mb-1">Staff Dashboard</h3>
          <p class="text-muted">Course Application Tracking System</p>
          <hr />
          <h5 class="mb-3">Account Information</h5>
          <div class="row mb-2">
            <div class="col-md-4 fw-bold">User ID</div>
            <div class="col-md-8" th:text="${currentUser.userId}">1</div>
          </div>
          <div class="row mb-2">
            <div class="col-md-4 fw-bold">Username</div>
            <div class="col-md-8" th:text="${currentUser.userName}">
              username
            </div>
          </div>
          <div class="row mb-2">
            <div class="col-md-4 fw-bold">Name</div>
            <div class="col-md-8" th:text="${currentUser.name}">
              Employee Name
            </div>
          </div>
          <div class="row mb-2">
            <div class="col-md-4 fw-bold">Designation</div>
            <div class="col-md-8" th:text="${currentUser.designation}">
              Designation
            </div>
          </div>
          <div class="row mb-2">
            <div class="col-md-4 fw-bold">Role</div>
            <div class="col-md-8">
              <span class="badge bg-primary" th:text="${currentUser.role}"
                >STAFF</span
              >
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
