<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout('Dashboard', 'Staff', 'dashboard', ~{::#content})}"
>
  <body>
    <section id="content" class="cats-stack">
      <div class="cats-page-header">
        <div>
          <h1>Dashboard</h1>
          <p class="cats-sub">
            Designation:
            <span th:text="${currentUser.designation}"></span>
          </p>
        </div>
        <a class="btn btn-primary" th:href="@{/staff/courses}"
          >Apply for a course</a
        >
      </div>
      <p>
        Reporting manager:
        <strong
          th:text="${currentUser.manager != null ? currentUser.manager.name : 'Not assigned'}"
        ></strong>
      </p>
      <div th:replace="~{fragments/application :: allowance(${summary})}"></div>
      <div class="cats-page-actions">
        <a class="btn btn-outline-secondary" th:href="@{/staff/personal}"
          >My course history</a
        ><a class="btn btn-outline-secondary" th:href="@{/staff/fee}"
          >Fee claims</a
        ><a
          th:if="${currentUser.role.name() == 'MANAGER'}"
          class="btn btn-outline-secondary"
          th:href="@{/manager/home}"
          >Manager dashboard</a
        >
      </div>
    </section>
  </body>
</html>
