<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Edit Course Batch</title>
  </head>

  <body>
    <h1>Edit Course Batch</h1>

    <p>
      <strong>Batch ID:</strong>
      <span th:text="${courseBatch.batchId}"></span>
    </p>

    <p>
      <strong>Course:</strong>
      <span th:text="${courseBatch.courseDetail.title}"></span>
    </p>

    <form
      th:action="@{/admin/batches/edit/{id}(id=${courseBatch.batchId})}"
      th:object="${courseBatch}"
      method="post"
    >
      <div>
        <label for="startDate">Start Date:</label>

        <input
          type="date"
          id="startDate"
          th:field="*{courseStartDate}"
          required
        />
      </div>

      <br />

      <div>
        <label for="endDate">End Date:</label>

        <input type="date" id="endDate" th:field="*{courseEndDate}" required />
      </div>

      <br />

      <div>
        <label for="trainingDays">Training Days:</label>

        <input
          type="number"
          id="trainingDays"
          th:field="*{trainingDays}"
          min="0.5"
          step="0.5"
          required
        />
      </div>

      <br />

      <div>
        <label for="capacity">Capacity:</label>

        <input
          type="number"
          id="capacity"
          th:field="*{capacity}"
          min="1"
          required
        />
      </div>

      <br />

      <button type="submit">Update Batch</button>
    </form>

    <br />

    <a th:href="@{/admin/batches}">Cancel</a>
  </body>
</html>
