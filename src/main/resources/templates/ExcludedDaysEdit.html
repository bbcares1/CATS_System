<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Edit public holiday', 'Admin', 'holidays', ~{::#content})}">
<body>
<section id="content">
  <div class="cats-page-header">
    <div>
      <h1>Edit public holiday</h1>
      <p class="cats-sub">Update the date or display name of this excluded day.</p>
    </div>
  </div>

  <section class="card">
    <div class="card-body">
      <form th:action="@{/excluded-days/edit/{id}(id=${excludedDay.id})}"
            th:object="${excludedDay}" method="post" class="cats-form" novalidate>
        <input type="hidden" th:field="*{id}">
        <div th:if="${#fields.hasAnyErrors()}" class="cats-error-summary" role="alert">
          <div><h2>Check the holiday details</h2>
            <ul><li th:each="error : ${#fields.allErrors()}" th:text="${error}">Please correct this field.</li></ul>
          </div>
        </div>
        <div class="row g-3">
          <div class="col-md-5">
            <label class="form-label" for="date">Date</label>
            <input type="date" id="date" th:field="*{date}" class="form-control" required>
            <div class="cats-field-msg" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></div>
          </div>
          <div class="col-md-7">
            <label class="form-label" for="description">Holiday name</label>
            <input type="text" id="description" th:field="*{description}" class="form-control" maxlength="255" required>
            <div class="cats-field-msg" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
          </div>
        </div>
        <div class="cats-form-footer">
          <a class="btn btn-outline-secondary" th:href="@{/excluded-days}">Cancel</a>
          <button type="submit" class="btn btn-primary">Save changes</button>
        </div>
      </form>
    </div>
  </section>
</section>
</body>
</html>
