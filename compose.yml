name: cats-dev
services:
  db:
    image: mysql:8.4
    environment:
      TZ: Asia/Singapore
      MYSQL_DATABASE: cats-dev
      MYSQL_USER: ${CATS_DEV_DB_USER:-cats-dev}
      MYSQL_PASSWORD: ${CATS_DEV_DB_PASSWORD:-cats-dev_password}
      MYSQL_ROOT_PASSWORD: ${CATS_DEV_ROOT_PASSWORD:-cats-dev_root_password}
    ports:
      - "127.0.0.1:${CATS_DEV_DB_PORT:-3307}:3306"
    volumes:
      - dev-data:/var/lib/mysql
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/db/demo-data.sql:/docker-entrypoint-initdb.d/02-demo-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
volumes:
  dev-data:
