<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Approval hierarchy', 'Admin', 'hierarchy', ~{::#content})}">
<body>
<section id="content">
  <div class="cats-page-header">
    <div>
      <h1>Approval hierarchy</h1>
      <p class="cats-sub">Set the role responsible at each approval level.</p>
    </div>
  </div>

  <section class="card mb-4">
    <div class="card-header">
      <h2 class="cats-card-title" th:text="${hierarchy.hierarchyId == null ? 'Add approval level' : 'Edit approval level'}">Add approval level</h2>
    </div>
    <div class="card-body">
      <form th:action="@{/admin/hierarchy/save}" th:object="${hierarchy}" method="post" class="cats-form" novalidate>
        <input type="hidden" th:field="*{hierarchyId}">
        <div th:if="${#fields.hasAnyErrors()}" class="cats-error-summary" role="alert">
          <div><h2>Check the approval level</h2>
            <ul><li th:each="error : ${#fields.allErrors()}" th:text="${error}">Please correct this field.</li></ul>
          </div>
        </div>
        <div class="row g-3">
          <div class="col-md-5">
            <label class="form-label" for="level">Approval level</label>
            <input type="number" id="level" min="1" th:field="*{level}" class="form-control" required>
            <div class="cats-field-msg" th:if="${#fields.hasErrors('level')}" th:errors="*{level}"></div>
            <div class="form-text">Use 1 for the first approval step.</div>
          </div>
          <div class="col-md-7">
            <label class="form-label" for="approvalRole">Approver role</label>
            <select id="approvalRole" th:field="*{role}" class="form-select" required>
              <option value="">Select a role</option>
              <option th:each="r : ${roles}" th:value="${r}" th:text="${r}">MANAGER</option>
            </select>
            <div class="cats-field-msg" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
          </div>
        </div>
        <div class="cats-form-footer">
          <a class="btn btn-outline-secondary" th:href="@{/admin/hierarchy}">Cancel</a>
          <button type="submit" class="btn btn-primary"
                  th:text="${hierarchy.hierarchyId == null ? 'Add approval level' : 'Save changes'}">Add approval level</button>
        </div>
      </form>
    </div>
  </section>

  <section class="card" aria-labelledby="hierarchy-table-title">
    <div class="card-header">
      <h2 id="hierarchy-table-title" class="cats-card-title">Configured approval levels</h2>
    </div>
    <div class="table-responsive">
      <table class="table align-middle mb-0">
        <thead>
          <tr><th scope="col">Level</th><th scope="col">Approver role</th><th scope="col" class="cats-row-actions">Actions</th></tr>
        </thead>
        <tbody>
          <tr th:each="h : ${hierarchies}" th:with="deleteId='delete-hierarchy-' + ${h.hierarchyId}">
            <td><span class="fw-semibold" th:text="${h.level}">1</span></td>
            <td><span th:replace="~{fragments/ui :: tag(${h.role})}"></span></td>
            <td class="cats-row-actions">
              <a class="btn btn-sm btn-outline-secondary"
                 th:href="@{/admin/hierarchy/edit/{id}(id=${h.hierarchyId})}">Edit</a>
              <button type="button" class="btn btn-sm btn-outline-danger"
                      data-bs-toggle="modal" th:attr="data-bs-target='#' + ${deleteId}">Delete</button>
              <div th:replace="~{fragments/ui :: confirm(${deleteId}, 'Delete approval level', 'This permanently removes this approval level.', @{/admin/hierarchy/delete/{id}(id=${h.hierarchyId})}, 'Delete level', true)}"></div>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(hierarchies)}">
            <td colspan="3">
              <div th:replace="~{fragments/ui :: empty('sitemap', 'No approval levels configured', 'Add an approval level to define the approval sequence.', ~{})}"></div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</section>
</body>
</html>
