# These defaults match the local database in compose.yml.
spring.datasource.url=${CATS_DEV_DB_URL:jdbc:mysql://localhost:3307/cats_dev}
spring.datasource.username=${CATS_DEV_DB_USER:cats_dev}
spring.datasource.password=${CATS_DEV_DB_PASSWORD:cats_dev_password}
spring.flyway.locations=classpath:db/migration,classpath:db/dev
