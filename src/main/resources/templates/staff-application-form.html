<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout('Course application', 'Staff', 'apply', ~{::#content})}"
>
  <body>
    <section id="content" class="cats-stack">
      <div class="cats-page-header">
        <div>
          <h1
            th:text="${editId == null ? 'Apply for a course' : 'Edit application'}"
          ></h1>
          <p class="cats-sub">
            Future working dates within one calendar year. Pending applications
            reserve your allowance.
          </p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/staff/courses}"
          >Back to courses</a
        >
      </div>
      <div th:replace="~{fragments/application :: allowance(${summary})}"></div>
      <div class="card card-body">
        <form
          class="cats-stack"
          id="application-form"
          th:action="@{${formAction}}"
          th:object="${form}"
          method="post"
          novalidate
        >
          <input type="hidden" th:field="*{version}" />
          <div
            class="cats-error-summary"
            role="alert"
            th:if="${#fields.hasErrors('*')}"
          >
            <div>
              <h2 class="cats-card-title">Please check your application</h2>
              <ul>
                <li
                  th:each="error : ${#fields.allErrors()}"
                  th:text="${error}"
                ></li>
              </ul>
            </div>
          </div>
          <div class="cats-field">
            <label class="form-label cats-req" for="courseTitle"
              >Course title</label
            ><input
              class="form-control"
              type="text"
              th:field="*{courseTitle}"
              th:errorclass="is-invalid"
              maxlength="200"
            />
            <div class="cats-field-msg" th:errors="*{courseTitle}"></div>
          </div>
          <div class="cats-grid cats-grid-2">
            <div class="cats-field">
              <label class="form-label cats-req" for="courseCategory"
                >Category</label
              ><select class="form-select" th:field="*{courseCategory}">
                <option value="">Choose a category</option>
                <option
                  th:each="category : ${categories}"
                  th:value="${category}"
                  th:text="${category.displayName}"
                ></option>
              </select>
              <div class="cats-field-msg" th:errors="*{courseCategory}"></div>
            </div>
            <div class="cats-field">
              <label class="form-label cats-req" for="trainingProvider"
                >Training provider</label
              ><input
                class="form-control"
                type="text"
                th:field="*{trainingProvider}"
                th:errorclass="is-invalid"
                maxlength="200"
              />
              <div class="cats-field-msg" th:errors="*{trainingProvider}"></div>
            </div>
          </div>
          <div id="custom-dates" class="cats-grid cats-grid-2">
            <div class="cats-field">
              <label class="form-label cats-req" for="courseStartDate"
                >Start date</label
              ><input
                class="form-control"
                type="date"
                th:field="*{courseStartDate}"
                th:errorclass="is-invalid"
                th:min="${today}"
              />
              <div class="cats-field-msg" th:errors="*{courseStartDate}"></div>
            </div>
            <div class="cats-field">
              <label class="form-label cats-req" for="courseEndDate"
                >End date</label
              ><input
                class="form-control"
                type="date"
                th:field="*{courseEndDate}"
                th:errorclass="is-invalid"
                th:min="${today}"
              />
              <div class="cats-field-msg" th:errors="*{courseEndDate}"></div>
            </div>
          </div>
          <div class="cats-field" id="half-day-field">
            <label class="form-label" for="halfDayPeriod">Session</label
            ><select class="form-select" th:field="*{halfDayPeriod}">
              <option value="">Full working days</option>
              <option value="AM">Morning (AM)</option>
              <option value="PM">Afternoon (PM)</option>
            </select>
            <div class="form-text">
              Half-day sessions are for one-day Internal Training only.
            </div>
            <div class="cats-field-msg" th:errors="*{halfDayPeriod}"></div>
          </div>
          <div class="cats-field">
            <label class="form-label cats-req" for="courseFee"
              >Course fee ($)</label
            ><input
              class="form-control"
              type="number"
              th:field="*{courseFee}"
              th:errorclass="is-invalid"
              min="0"
              step="0.01"
            />
            <div class="cats-field-msg" th:errors="*{courseFee}"></div>
          </div>
          <div class="cats-field">
            <label class="form-label cats-req" for="justification"
              >Why do you need this course?</label
            ><textarea
              rows="3"
              maxlength="2000"
              class="form-control"
              th:field="*{justification}"
              th:errorclass="is-invalid"
            ></textarea>
            <div class="cats-field-msg" th:errors="*{justification}"></div>
          </div>
          <div class="cats-field">
            <label class="form-label" for="workDissemination"
              >Work arrangements during the course</label
            ><textarea
              rows="3"
              maxlength="2000"
              class="form-control"
              th:field="*{workDissemination}"
              th:errorclass="is-invalid"
            ></textarea>
            <div class="cats-field-msg" th:errors="*{workDissemination}"></div>
          </div>
          <div
            class="cats-field"
            th:if="${editId == null and !#lists.isEmpty(reviewers)}"
          >
            <label class="form-label cats-req" for="reviewerId"
              >Approving Manager</label
            ><select class="form-select" th:field="*{reviewerId}">
              <option value="">Choose a Manager</option>
              <option
                th:each="manager : ${reviewers}"
                th:value="${manager.userId}"
                th:text="${manager.name} + ' (' + ${manager.staffId} + ')'"
              ></option>
            </select>
          </div>
          <p
            class="text-secondary"
            th:if="${editId == null and employee.manager != null}"
          >
            Approving Manager: <span th:text="${employee.manager.name}"></span>
          </p>
          <div class="cats-form-footer">
            <a class="btn btn-outline-secondary" th:href="@{/staff/personal}"
              >Cancel</a
            ><button
              class="btn btn-primary"
              type="submit"
              th:text="${editId == null ? 'Submit application' : 'Save changes'}"
            ></button>
          </div>
        </form>
      </div>
      <script defer th:src="@{/js/application-form.js}"></script>
    </section>
  </body>
</html>
