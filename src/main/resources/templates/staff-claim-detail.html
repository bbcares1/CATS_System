<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Claim Details</title>
        <link rel="stylesheet" th:href="@{/css/category.css}">
        <link rel="stylesheet" th:href="@{/css/staff.css}">
    </head>
    <body>
        <main class="container">
            <nav>
                <a th:href="@{/staff/home}">Dashboard</a>
                <a class="active" th:href="@{/staff/fee}">Course Fee Claims</a>
                <a th:href="@{/logout}">Logout</a>
            </nav>
            <h1>Claim <span th:text="${claim.applicationId}"></span></h1>
            <!-- Claim details: Show the course, claim status and decision. -->
            <dl>
                <dt>Course</dt>
                <dd th:text="${claim.courseApplication != null ? claim.courseApplication.courseTitle : 'Existing batch claim'}"></dd>
                <dt>Status</dt>
                <dd th:text="${claim.applicationStatus}"></dd>
                <dt>Manager's reason</dt>
                <dd th:text="${claim.decisionReason ?: 'Pending review'}"></dd>
                <dt>Submitted</dt>
                <dd th:text="${claim.submittedAt}"></dd>
                <dt>Reviewed</dt>
                <dd th:text="${claim.reviewedAt}"></dd>
                <dt>Reimbursement recorded</dt>
                <dd th:text="${claim.reimbursedAt ?: 'Not recorded'}"></dd>
            </dl>
            <!-- Claim documents: Download the receipt or completion certificate. -->
            <a class="btn btn-secondary" th:href="@{/staff/claims/{id}/receipt(id=${claim.applicationId})}">Download Receipt</a>
            <a class="btn btn-secondary" th:href="@{/staff/claims/{id}/certificate(id=${claim.applicationId})}">Download Certificate</a>
        </main>
    </body>
</html>
