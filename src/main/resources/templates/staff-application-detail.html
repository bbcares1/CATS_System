<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout('Application details', 'Staff', 'history', ~{::#content})}"
>
  <body>
    <section id="content" class="cats-stack">
      <div class="cats-page-header">
        <div>
          <a class="cats-back" th:href="@{/staff/personal}">Back to history</a>
          <h1 th:text="${course.courseTitle}"></h1>
        </div>
        <a
          class="btn btn-primary"
          th:if="${course.status.name() == 'APPLIED' or course.status.name() == 'UPDATED'}"
          th:href="@{/staff/applications/{id}/edit(id=${course.courseId})}"
          >Edit application</a
        >
      </div>
      <div th:replace="~{fragments/application :: facts(${course})}"></div>
      <div
        th:if="${course.status.name() == 'APPLIED' or course.status.name() == 'UPDATED'}"
      >
        <button
          type="button"
          class="btn btn-outline-danger"
          data-bs-toggle="modal"
          data-bs-target="#delete-confirm"
        >
          Delete application
        </button>
        <div
          class="modal fade"
          id="delete-confirm"
          tabindex="-1"
          aria-labelledby="delete-title"
          aria-hidden="true"
        >
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h2 class="modal-title fs-6" id="delete-title">
                  Delete application?
                </h2>
                <button
                  class="btn-close"
                  type="button"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                ></button>
              </div>
              <div class="modal-body">
                This keeps the application in your history and releases its
                reserved allowance.
              </div>
              <div class="modal-footer">
                <button
                  type="button"
                  class="btn btn-outline-secondary"
                  data-bs-dismiss="modal"
                >
                  Back
                </button>
                <form
                  method="post"
                  th:action="@{/staff/applications/{id}/delete(id=${course.courseId})}"
                >
                  <input th:replace="~{fragments/csrf :: token}" />
                  <input
                    type="hidden"
                    name="version"
                    th:value="${course.version}"
                  /><button class="btn btn-danger">Delete application</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div th:if="${course.status.name() == 'APPROVED'}">
        <button
          type="button"
          class="btn btn-outline-danger"
          data-bs-toggle="modal"
          data-bs-target="#cancel-confirm"
        >
          Cancel application
        </button>
        <div
          class="modal fade"
          id="cancel-confirm"
          tabindex="-1"
          aria-labelledby="cancel-title"
          aria-hidden="true"
        >
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h2 class="modal-title fs-6" id="cancel-title">
                  Cancel application?
                </h2>
                <button
                  class="btn-close"
                  type="button"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                ></button>
              </div>
              <div class="modal-body">
                This keeps the application in your history and releases its
                reserved allowance.
              </div>
              <div class="modal-footer">
                <button
                  type="button"
                  class="btn btn-outline-secondary"
                  data-bs-dismiss="modal"
                >
                  Back
                </button>
                <form
                  method="post"
                  th:action="@{/staff/applications/{id}/cancel(id=${course.courseId})}"
                >
                  <input th:replace="~{fragments/csrf :: token}" />
                  <input
                    type="hidden"
                    name="version"
                    th:value="${course.version}"
                  /><button class="btn btn-danger">Cancel application</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div
        class="card card-body"
        th:if="${course.status.name() == 'APPROVED' and course.courseEndDate.isBefore(today)}"
      >
        <form
          class="cats-stack"
          method="post"
          th:action="@{/staff/applications/{id}/complete(id=${course.courseId})}"
        >
          <input th:replace="~{fragments/csrf :: token}" />
          <input
            type="hidden"
            name="version"
            th:value="${course.version}"
          /><label class="form-label cats-req" for="experienceComments"
            >What did you learn?</label
          ><textarea
            class="form-control"
            id="experienceComments"
            name="experienceComments"
            rows="4"
            maxlength="2000"
            th:text="${experienceComments}"
          ></textarea
          ><button class="btn btn-primary">Mark completed</button>
        </form>
      </div>
    </section>
  </body>
</html>
