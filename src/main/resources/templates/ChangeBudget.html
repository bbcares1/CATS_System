<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>修改员工培训额度</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f6f9;
        }
        .form-container {
            max-width: 450px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        input[readonly] {
            background-color: #e9ecef;
            color: #495057;
            cursor: not-allowed;
        }
        .btn-group {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            text-align: center;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>修改培训额度</h2>

    <!-- 提交给 Controller 的 POST 路径 /admin/save，绑定 model 里的 "employee" 对象 -->
    <form th:action="@{/admin/save}" th:object="${employee}" method="post">
        
        <!-- 隐藏域：保存主键 id，用于告诉 JPA 要更新哪条记录 -->
        <input type="hidden" th:field="*{id}" />

        <!-- 员工编号：设置为 readonly 只能查看，不能修改 -->
        <div class="form-group">
            <label for="staffId">员工编号 (Staff ID):</label>
            <input type="text" id="staffId" th:field="*{staffId}" readonly />
        </div>

        <!-- 培训预算输入框 -->
        <div class="form-group">
            <label for="trainingBudget">培训预算 (Training Budget):</label>
            <input type="number" id="trainingBudget" th:field="*{trainingBudget}" step="0.01" min="0" required />
        </div>

        <!-- 培训天数输入框 -->
        <div class="form-group">
            <label for="trainingDays">培训天数 (Training Days):</label>
            <input type="number" id="trainingDays" th:field="*{trainingDays}" step="1" min="0" required />
        </div>

        <!-- 操作按钮 -->
        <div class="btn-group">
            <button type="submit" class="btn btn-primary">保存修改</button>
            <a th:href="@{/admin/showBudgetList}" class="btn btn-secondary">取消</a>
        </div>
    </form>
</div>

</body>
</html>
