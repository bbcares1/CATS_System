<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout('Accounts and reporting managers', 'Admin', 'accounts', ~{::#content})}"
>
  <body>
    <section id="content" class="cats-stack">
      <nav th:replace="~{fragments/ui :: accountTabs('accounts')}"></nav>
      <div class="cats-page-header">
        <div>
          <h1>Accounts and reporting managers</h1>
        </div>
        <a class="btn btn-primary" th:href="@{/admin/accounts/new}">
          Add account
        </a>
      </div>
      <div class="card">
        <div class="table-responsive" tabindex="0">
          <table class="table">
            <thead>
              <tr>
                <th>Employee</th>
                <th>Username</th>
                <th>Role</th>
                <th>Reports to</th>
                <th>Access</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="u : ${accounts}">
                <td class="cats-col-main">
                  <span th:text="${u.name}"> </span>
                  <div
                    class="cats-cell-sub"
                    th:text="${u.staffId ?: 'Staff ID needed'}"
                  ></div>
                </td>
                <td th:text="${u.userName}"></td>
                <td
                  th:text="${#strings.capitalize(#strings.toLowerCase(u.role))}"
                ></td>
                <td th:text="${u.manager?.name ?: 'Not assigned'}"></td>
                <td th:text="${u.active} ? 'Active' : 'Disabled'"></td>
                <td class="cats-row-actions">
                  <a
                    class="btn btn-sm btn-quiet"
                    th:href="@{/admin/accounts/{id}/edit(id=${u.userId})}"
                  >
                    Edit
                  </a>
                  <a
                    th:if="${u instanceof T(group6.project.model.Staff)}"
                    class="btn btn-sm btn-quiet"
                    th:href="@{/admin/entitlements/{id}(id=${u.userId})}"
                  >
                    Allowance
                  </a>
                  <a
                    th:if="${u instanceof T(group6.project.model.Staff) and u.email != null}"
                    class="btn btn-sm btn-quiet"
                    th:href="@{/admin/emails(compose=true,recipientEmail=${u.email})}"
                    >Email</a
                  >
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div
        th:replace="~{fragments/list-pagination :: pager(${pageData}, '/admin/accounts', null, null)}"
      ></div>
    </section>
  </body>
</html>
