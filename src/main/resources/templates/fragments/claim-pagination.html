<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><body>
<!-- Paged metadata lists never load receipt or certificate bytes. -->
<nav th:fragment="pager(page,route,pageParameter)" aria-label="List pagination" class="card-footer">
  <form method="get" th:action="${route}" class="cats-page-actions">
    <button class="btn btn-outline-secondary" th:name="${pageParameter}" th:value="${page.number-1}" th:disabled="${!page.hasPrevious()}">Previous</button>
    <span th:text="'Page ' + ${page.number+1} + ' of ' + ${page.totalPages == 0 ? 1 : page.totalPages}"></span>
    <button class="btn btn-outline-secondary" th:name="${pageParameter}" th:value="${page.number+1}" th:disabled="${!page.hasNext()}">Next</button>
    <label>Rows <select name="size" class="form-select"><option th:each="n : ${ {10,20,25} }" th:value="${n}" th:selected="${n == page.size}" th:text="${n}"></option></select></label>
    <button class="btn btn-outline-secondary">Apply</button>
  </form>
</nav>
</body></html>
