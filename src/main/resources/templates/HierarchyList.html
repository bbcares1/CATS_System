<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout('Reporting managers', 'Admin', 'accounts', ~{::#content})}"
>
  <body>
    <section id="content" class="cats-stack">
      <nav th:replace="~{fragments/ui :: accountTabs('hierarchy')}"></nav>
      <div class="cats-page-header">
        <div>
          <h1>Reporting managers</h1>
        </div>
        <a class="btn btn-primary" th:href="@{/admin/accounts}"
          >Manage accounts</a
        >
      </div>
      <div class="card">
        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th>Employee</th>
                <th>Role</th>
                <th>Reporting manager</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="employee : ${employees}">
                <td>
                  <strong th:text="${employee.name}"></strong>
                  <div
                    class="cats-cell-sub"
                    th:text="${employee.staffId}"
                  ></div>
                </td>
                <td
                  th:text="${#strings.capitalize(#strings.toLowerCase(employee.role))}"
                ></td>
                <td
                  th:text="${employee.manager == null ? 'Not assigned' : employee.manager.name}"
                ></td>
                <td>
                  <a
                    class="btn btn-sm btn-quiet"
                    th:href="@{/admin/accounts/{id}/edit(id=${employee.userId})}"
                    >Edit assignment</a
                  >
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(employees)}">
                <td colspan="4" class="cats-empty">No employees yet.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div
        th:replace="~{fragments/list-pagination :: pager(${pageData}, '/admin/hierarchy', null, null)}"
      ></div>
    </section>
  </body>
</html>
