<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Delete course category', 'Admin', 'categories', ~{::#content})}">
<body>
<section id="content">
  <div class="cats-page-header">
    <div>
      <h1>Delete a course category</h1>
      <p class="cats-sub">Choose a category to remove from the catalogue.</p>
    </div>
    <a class="btn btn-outline-secondary" th:href="@{/admin/categories}">Back to categories</a>
  </div>

  <section class="card">
    <div class="card-header">
      <h2 class="cats-card-title">Categories</h2>
      <p class="text-secondary small mb-0">A category in use by a course may not be removable.</p>
    </div>
    <div class="list-group list-group-flush">
      <div class="list-group-item d-flex align-items-center justify-content-between gap-3"
           th:each="category : ${categories}"
           th:with="deleteId='delete-category-page-' + ${category.categoryId}">
        <div>
          <div class="fw-semibold" th:text="${category.categoryName}">Category name</div>
          <div class="cats-cell-sub" th:text="${'Category ID ' + category.categoryId}">Category ID</div>
        </div>
        <div>
          <button type="button" class="btn btn-sm btn-outline-danger"
                  data-bs-toggle="modal" th:attr="data-bs-target='#' + ${deleteId}">Delete</button>
          <div th:replace="~{fragments/ui :: confirm(${deleteId}, 'Delete course category', 'This permanently removes the category. A category used by a course may not be deleted.', @{/admin/categories/delete/{id}(id=${category.categoryId})}, 'Delete category', true)}"></div>
        </div>
      </div>
      <div th:if="${#lists.isEmpty(categories)}">
        <div th:replace="~{fragments/ui :: empty('tag', 'No categories to delete', 'There are no course categories in the catalogue.', ~{})}"></div>
      </div>
    </div>
  </section>
</section>
</body>
</html>
