<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('Course history', 'Staff', 'history', ~{::#content})}">
<body><section id="content" class="cats-stack">

            <!-- Navigation: Links to staff pages. -->

            <div class="cats-page-header"><div><h1>Personal Course History - <span th:text="${year}"></span></h1></div></div>


            <div class="card card-body">Remaining training days: <strong th:text="${summary.remainingDays}"></strong> | Remaining budget: $<strong th:text="${summary.remainingBudget}"></strong>
            </div>
            <!-- Pagination: Number of results per page selectable by the reader. -->
            <form th:action="@{/staff/personal}" method="get">
                <label class="form-label" for="size">Results per page</label>
                <select class="form-select" name="size" id="size">
                    <option value="10" th:selected="${size == 10}">10</option>
                    <option value="20" th:selected="${size == 20}">20</option>
                    <option value="25" th:selected="${size == 25}">25</option>
                </select>
                <button class="btn btn-outline-secondary" type="submit">Show</button>
            </form>
            <div class="card cats-table-wrap" tabindex="0">
                <!-- Personal course history: Show the employee applications for the current year. -->
                <table class="table cats-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Course title</th>
                            <th>Category</th>
                            <th>Start</th>
                            <th>End</th>
                            <th>Fee ($)</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="course : ${applications}">
                            <td th:text="${course.courseId}"></td>
                            <td>
                                <a th:href="@{/staff/applications/{id}(id=${course.courseId})}" th:text="${course.courseTitle}"></a></td>
                            <td th:text="${course.courseCategory.displayName}"></td>
                            <td th:text="${course.courseStartDate}"></td>
                            <td th:text="${course.courseEndDate}"></td>
                            <td th:text="${course.courseFee}"></td>
                            <td><span th:replace="~{fragments/ui :: status(${course.status})}"></span></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(applications)}">
                            <td colspan="7">No applications for the current year.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <p>Page <span th:text="${page + 1}"></span> of <span th:text="${lastPage + 1}"></span></p>
            <a class="btn btn-outline-secondary" th:if="${page > 0}" th:href="@{/staff/personal(page=${page - 1},size=${size})}">Previous</a>
            <a class="btn btn-outline-secondary" th:if="${page < lastPage}" th:href="@{/staff/personal(page=${page + 1},size=${size})}">Next</a>

</section></body></html>
