spring.application.name=project




# I am doing some monkey business
#This code is not checked in
# Connection to MySQL DB

#create a schema in mySQL called group6
spring.datasource.url=jdbc:mysql://localhost:3306/group6
spring.datasource.username=root

#enter your own password
spring.datasource.password=

#Connection to H2/MSSQL Server
#spring.datasource.url=

#spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Session is connecting the java program to db
# false connection to the DB pool conserved
spring.jpa.open-in-view=false

# Keep existing data; do not run data.sql on every startup.
spring.sql.init.mode=never
# Used if data.sql initialization is enabled later.
spring.jpa.defer-datasource-initialization=true

# Local staff setup (uses the team connection above unless overridden locally).
spring.config.import=optional:file:./.local-staff.properties

# Receipt and certificate upload limits.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=11MB
