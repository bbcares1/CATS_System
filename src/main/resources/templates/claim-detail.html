<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('Review claim', 'Manager', 'claims', ~{::#content})}">
  <body>
    <section id="content" class="cats-stack">
      <div class="cats-page-header">
        <div>
          <h1>
            Review claim
          </h1>
        </div>
      </div>
      <!-- Evidence, review and payment each retain their own saved information. -->
      <a class="cats-back" th:href="${managerView == true} ? @{/manager/claims} : @{/staff/fee}">
        Back to claims
      </a>
      <div class="card">
        <div class="card-body cats-stack">
          <dl class="cats-dl">
            <dt>
              Employee
            </dt>
            <dd th:text="${claim.applicant.name + ' · ' + claim.applicant.staffId}">
            </dd>
            <dt>
              Course
            </dt>
            <dd th:text="${claim.courseApplication != null ? claim.courseApplication.courseTitle : 'Legacy claim'}">
            </dd>
            <dt>
              Amount
            </dt>
            <dd th:text="'$' + ${claim.amount}">
            </dd>
            <dt>
              Status
            </dt>
            <dd>
              <span th:replace="~{fragments/ui :: status(${claim.applicationStatus})}">
              </span>
            </dd>
            <dt>
              Assigned reviewer
            </dt>
            <dd th:text="${claim.approvalManager != null ? claim.approvalManager.name : 'Not assigned'}">
            </dd>
            <dt>
              Manager's reason
            </dt>
            <dd th:text="${claim.decisionReason ?: 'Pending review'}">
            </dd>
            <dt>
              Reviewed by
            </dt>
            <dd th:text="${claim.reviewer != null ? claim.reviewer.name : 'Pending review'}">
            </dd>
            <dt>
              Reimbursement recorded
            </dt>
            <dd th:text="${claim.reimbursedAt ?: 'Not recorded'}">
            </dd>
            <dt>
              Payment reference
            </dt>
            <dd th:text="${claim.paymentReference ?: 'Not recorded'}">
            </dd>
          </dl>
          <div class="cats-page-actions">
            <a class="btn btn-outline-secondary" th:href="${managerView == true} ? @{/manager/claims/{id}/receipt(id=${claim.applicationId})} : @{/staff/claims/{id}/receipt(id=${claim.applicationId})}">
              Download receipt
            </a>
            <a class="btn btn-outline-secondary" th:href="${managerView == true} ? @{/manager/claims/{id}/certificate(id=${claim.applicationId})} : @{/staff/claims/{id}/certificate(id=${claim.applicationId})}">
              Download certificate
            </a>
          </div>
          <form th:if="${managerView == true and claim.applicationStatus == T(group6.project.model.ApplicationStatus).APPLIED}" th:action="@{/manager/claims/{id}/decision(id=${claim.applicationId})}" method="post" class="cats-stack">
            <input type="hidden" name="version" th:value="${claim.version}">
            <div>
              <label for="reason" class="form-label cats-req">
                Decision reason
              </label>
              <textarea id="reason" name="reason" class="form-control" rows="3" maxlength="2000" required th:text="${reason}">
              </textarea>
            </div>
            <div class="cats-page-actions">
              <button class="btn btn-primary" name="decision" value="approve">
                Approve claim
              </button>
              <button class="btn btn-outline-danger" name="decision" value="reject">
                Reject claim
              </button>
            </div>
            <p class="form-text">
              Approval confirms the claim. Admin records reimbursement separately after payment.
            </p>
          </form>
        </div>
      </div>
    </section>
  </body>
</html>
