<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout('Course details', 'Admin', 'courses', ~{::#content})}"
>
  <body>
    <section id="content" class="cats-stack">
      <div class="cats-page-header">
        <div>
          <a class="cats-back" th:href="@{/admin/courses}">Back to list</a>
          <h1 th:text="${editId == null} ? 'Add course' : 'Edit course'">
            Course
          </h1>
          <p class="cats-sub">
            Category controls the rules. Internal Training is free. Changes
            apply to new applications only.
          </p>
        </div>
      </div>
      <div class="card card-body">
        <form
          method="post"
          th:action="@{${formAction}}"
          th:object="${form}"
          class="cats-stack"
          novalidate
        >
          <input type="hidden" th:field="*{version}" />
          <div
            th:if="${#fields.hasErrors('*')}"
            class="alert alert-danger"
            role="alert"
          >
            <ul class="mb-0">
              <li
                th:each="error : ${#fields.allErrors()}"
                th:text="${error}"
              ></li>
            </ul>
          </div>
          <div class="cats-grid cats-grid-2">
            <div>
              <label class="form-label" for="title">Course title</label
              ><input
                class="form-control"
                type="text"
                th:field="*{title}"
                required
                maxlength="255"
              />
              <div class="text-danger" th:errors="*{title}"></div>
            </div>
            <div>
              <label class="form-label" for="categoryId">Category</label
              ><select class="form-select" th:field="*{categoryId}">
                <option value="">Choose one</option>
                <option
                  th:each="item : ${categories}"
                  th:value="${item.categoryId}"
                  th:text="${item.categoryName}"
                ></option>
              </select>
              <div class="text-danger" th:errors="*{categoryId}"></div>
            </div>
            <div>
              <label class="form-label" for="providerId"
                >Training provider</label
              ><select class="form-select" th:field="*{providerId}">
                <option value="">Choose one</option>
                <option
                  th:each="item : ${providers}"
                  th:value="${item.providerId}"
                  th:text="${item.name}"
                ></option>
              </select>
              <div class="text-danger" th:errors="*{providerId}"></div>
            </div>
            <div>
              <label class="form-label" for="courseFee">Course fee ($)</label
              ><input
                class="form-control"
                type="number"
                th:field="*{courseFee}"
                min="0"
                step="0.01"
                required
              />
              <div class="text-danger" th:errors="*{courseFee}"></div>
            </div>
            <div>
              <label class="form-label" for="courseDescription"
                >Description</label
              ><textarea
                class="form-control"
                th:field="*{courseDescription}"
                maxlength="2000"
                rows="4"
              ></textarea>
            </div>
            <label class="form-check"
              ><input
                class="form-check-input"
                type="checkbox"
                th:field="*{customDatesAllowed}"
              /><span class="form-check-label"
                >Employees may choose their own dates</span
              ></label
            ><label class="form-check"
              ><input
                class="form-check-input"
                type="checkbox"
                th:field="*{active}"
              /><span class="form-check-label"
                >Published in the catalogue</span
              ></label
            >
          </div>
          <div class="cats-page-actions">
            <button class="btn btn-primary">Save</button
            ><a class="btn btn-outline-secondary" th:href="@{/admin/courses}"
              >Cancel</a
            >
          </div>
        </form>
      </div>
    </section>
  </body>
</html>
