<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout('Course categories', 'Admin', 'categories', ~{::#content})}"
>
  <body>
    <section id="content" class="cats-stack">
      <div class="cats-page-header">
        <h1>Course categories</h1>
        <div class="cats-page-actions">
          <a class="btn btn-primary" th:href="@{/admin/categories/new}"
            >Add category</a
          >
        </div>
      </div>
      <div class="card card-body">
        <p th:if="${#lists.isEmpty(rows)}">
          No records yet. Add one to get started.
        </p>
        <div class="table-responsive" th:unless="${#lists.isEmpty(rows)}">
          <table class="table align-middle">
            <thead>
              <tr>
                <th scope="col">Name</th>
                <th scope="col">Rule type</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="row : ${rows}">
                <td><b th:text="${row.categoryName}"></b></td>
                <td><span th:text="${row.kind.displayName}"></span></td>
                <td>
                  <div class="cats-page-actions">
                    <a
                      th:href="@{/admin/categories/{id}/edit(id=${row.categoryId})}"
                      >Edit</a
                    >
                    <form
                      method="post"
                      th:action="@{/admin/categories/{id}/delete(id=${row.categoryId})}"
                      onsubmit="
                        return confirm(
                          'Remove this record from active use? Referenced records may be archived or kept.',
                        );
                      "
                    >
                      <input th:replace="~{fragments/csrf :: token}" />
                      <input
                        type="hidden"
                        name="version"
                        th:value="${row.version}"
                      /><button class="btn btn-link text-danger p-0">
                        Remove
                      </button>
                    </form>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div
        th:replace="~{fragments/list-pagination :: pager(${pageData},'/admin/categories',null,null)}"
      ></div>
    </section>
  </body>
</html>
