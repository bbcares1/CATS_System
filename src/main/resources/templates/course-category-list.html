<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<link rel="stylesheet" th:href="@{/css/category.css}">

<head>
    <meta charset="UTF-8">
    <title>Manage Course Categories</title>
</head>

<body>

    <h1>Manage Course Categories</h1>

    <!-- Add button -->
    <a th:href="@{/admin/categories/new}">
        <button type="button">Add Category</button>
    </a>

    <br><br>

    <table border="1">
        <thead>
            <tr>
                <th>No.</th>
                <th>Category Name</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="category, status : ${categories}">

                <!-- Display ID -->
                <td th:text="${status.count}"></td>

                <td th:text="${category.categoryName}"></td>

                <td>
                    <!-- Edit -->
                    <a th:href="@{/admin/categories/edit/{id}(id=${category.categoryId})}">
                        <button type="button">Edit</button>
                    </a>

                    <!-- Delete -->
                    <a th:href="@{/admin/categories/delete}">
                        <button type="button">Delete</button>
                    </a>
                </td>

            </tr>
        </tbody>
    </table>

</body>

</html>
