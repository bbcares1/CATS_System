<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout('Category details', 'Admin', 'categories', ~{::#content})}"
>
  <body>
    <section id="content" class="cats-stack">
      <div class="cats-page-header">
        <div>
          <a class="cats-back" th:href="@{/admin/categories}">Back to list</a>
          <h1 th:text="${editId == null} ? 'Add category' : 'Edit category'">
            Category
          </h1>
          <p class="cats-sub">
            Labels help people browse. The rule type determines half-day and
            budget rules.
          </p>
        </div>
      </div>
      <div class="card card-body">
        <form
          method="post"
          th:action="@{${formAction}}"
          th:object="${form}"
          class="cats-stack"
          novalidate
        >
          <input th:replace="~{fragments/csrf :: token}" />
          <input type="hidden" th:field="*{version}" />
          <div
            th:if="${#fields.hasErrors('*')}"
            class="alert alert-danger"
            role="alert"
          >
            <ul class="mb-0">
              <li
                th:each="error : ${#fields.allErrors()}"
                th:text="${error}"
              ></li>
            </ul>
          </div>
          <div class="cats-grid cats-grid-2">
            <div>
              <label class="form-label" for="categoryName">Category name</label
              ><input
                class="form-control"
                type="text"
                th:field="*{categoryName}"
                required
                maxlength="100"
              />
              <div class="text-danger" th:errors="*{categoryName}"></div>
            </div>
            <div>
              <label class="form-label" for="kind">Rule type</label
              ><select class="form-select" th:field="*{kind}">
                <option value="">Choose one</option>
                <option
                  th:each="item : ${kinds}"
                  th:value="${item}"
                  th:text="${item.displayName}"
                ></option>
              </select>
              <div class="text-danger" th:errors="*{kind}"></div>
            </div>
          </div>
          <div class="cats-page-actions">
            <button class="btn btn-primary">Save</button
            ><a class="btn btn-outline-secondary" th:href="@{/admin/categories}"
              >Cancel</a
            >
          </div>
        </form>
      </div>
    </section>
  </body>
</html>
