<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CATS - Login Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container d-flex flex-column justify-content-center align-items-center vh-100">
    <div class="card shadow p-4" style="max-width: 480px; width: 100%;">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary">CATS Portal</h3>
            <p class="text-muted small">Course Application Tracking System</p>
            <p class="mt-3">Select the login portal of your role:</p>
        </div>
        <div class="d-grid gap-3">
            <a th:href="@{/staff/login}" class="btn btn-primary btn-lg">Employee (Staff / Manager)</a>
            <a th:href="@{/admin/login}" class="btn btn-dark btn-lg">Administrator</a>
        </div>
    </div>
</div>
</body>
</html>
