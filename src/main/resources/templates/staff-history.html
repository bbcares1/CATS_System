<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout('Course history', 'Staff', 'history', ~{::#content})}"
>
  <body>
    <section id="content" class="cats-stack">
      <div class="cats-page-header">
        <div>
          <h1>Personal course history</h1>
          <p class="cats-sub" th:text="${year}"></p>
        </div>
        <a class="btn btn-primary" th:href="@{/staff/courses}"
          >Apply for a course</a
        >
      </div>
      <div th:replace="~{fragments/application :: allowance(${summary})}"></div>
      <form class="cats-toolbar" method="get" th:action="@{/staff/personal}">
        <label for="year">Year</label
        ><input
          class="form-control"
          type="number"
          id="year"
          name="year"
          min="2000"
          max="2100"
          th:value="${year}"
        /><label for="size">Results per page</label
        ><select class="form-select" id="size" name="size">
          <option
            th:each="count : ${ {10,20,25} }"
            th:value="${count}"
            th:selected="${count == pageData.size}"
            th:text="${count}"
          ></option></select
        ><button class="btn btn-outline-secondary">Show</button>
      </form>
      <div
        th:replace="~{fragments/application :: table(${applications}, '/staff/applications')}"
      ></div>
      <nav aria-label="History pages" class="cats-toolbar">
        <a
          class="btn btn-outline-secondary"
          th:if="${pageData.hasPrevious()}"
          th:href="@{/staff/personal(year=${year},page=${pageData.number - 1},size=${pageData.size})}"
          >Previous</a
        ><span
          th:text="'Page ' + ${pageData.number + 1} + ' of ' + ${pageData.totalPages == 0 ? 1 : pageData.totalPages}"
        ></span
        ><a
          class="btn btn-outline-secondary"
          th:if="${pageData.hasNext()}"
          th:href="@{/staff/personal(year=${year},page=${pageData.number + 1},size=${pageData.size})}"
          >Next</a
        >
      </nav>
    </section>
  </body>
</html>
