<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Edit course batch', 'Admin', 'batches', ~{::#content})}">
<body>
<section id="content">
  <div class="cats-page-header">
    <div>
      <a class="cats-back" th:href="@{/admin/batches/{id}(id=${courseBatch.batchId})}">
        <svg th:replace="~{fragments/icons :: icon('arrow-left')}"></svg>Batch details
      </a>
      <h1>Edit course batch</h1>
      <p class="cats-sub" th:text="${courseBatch.courseDetail.title}">Course title</p>
    </div>
  </div>

  <section class="card">
    <div class="card-body px-4 pt-4 pb-2">
      <form id="course-batch-edit-form"
            th:action="@{/admin/batches/edit/{id}(id=${courseBatch.batchId})}"
            th:object="${courseBatch}" method="post" class="cats-form" novalidate>
        <div class="cats-form-section">
          <div>
            <h2>Batch details</h2>
            <p>Change the training duration or participant limit. Recalculate dates in the calendar after changing the duration.</p>
          </div>
          <div class="cats-form">
            <div class="cats-field">
              <span class="form-label">Batch</span>
              <span th:text="${'Batch ' + courseBatch.batchId}">Batch 1</span>
            </div>
            <div class="cats-field">
              <label class="form-label cats-req" for="trainingDays">Training days</label>
              <input type="number" id="trainingDays" th:field="*{trainingDays}"
                     class="form-control" min="0.5" step="0.5" required>
              <div class="form-text">Use half-day increments.</div>
            </div>
            <div class="cats-field">
              <label class="form-label cats-req" for="capacity">Capacity</label>
              <input type="number" id="capacity" th:field="*{capacity}"
                     class="form-control" min="1" step="1" required>
            </div>
          </div>
        </div>
      </form>
    </div>
    <div class="card-footer px-4 py-3 cats-form-footer">
      <a class="btn btn-outline-secondary" th:href="@{/admin/batches}">Cancel</a>
      <button class="btn btn-primary" type="submit" form="course-batch-edit-form">Save changes</button>
    </div>
  </section>
</section>
</body>
</html>
